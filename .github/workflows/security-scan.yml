name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  scan-ui:
    name: Scan UI dependencies (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/next-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/next-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security scan
        run: npm run scan
