services:
  db:
    image: postgres:16
    container_name: aura-db
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura_amber
    ports:
      - "5432:5432"
    volumes:
      - aura-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    ports:
      - "6379:6379"
    volumes:
      - aura-redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-api
    env_file: .env
    environment:
      DB_URL: postgres://aura:aura@db:5432/aura_amber?sslmode=disable
      DATABASE_URL: postgres://aura:aura@db:5432/aura_amber?sslmode=disable
      WORKER_URL: http://worker:8090
    depends_on:
      - db
      - worker
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: aura-worker
    environment:
      DB_URL: postgres://aura:aura@db:5432/aura_amber?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WORKER_HTTP_PORT: "8090"
    depends_on:
      - db
      - redis
    ports:
      - "8090:8090"

volumes:
  aura-db-data:
  aura-redis-data:
