services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://aura:aura@db:5432/aura_amber?sslmode=disable}
      WORKER_URL: http://worker:8090
    depends_on:
      - db
      - redis
      - worker

  worker:
    build: ./worker
    command: npm start
    ports:
      - "8090:8090"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_HTTP_PORT: 8090
    depends_on:
      - redis
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura_amber
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db-data:
